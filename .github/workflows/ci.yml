name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 10 * * 1-5' # nightly regression on weekdays (10:23 UTC)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  android-e2e:
    name: Android E2E (emulator API ${{ matrix.api-level }})
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2
      - name: Download app under test
        run: ./scripts/download-app.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: npm run test:android
      - name: Test summary
        if: ${{ !cancelled() }}
        run: node scripts/junit-summary.mjs
      - name: Upload reports (JUnit, Appium log, failure screenshots + UI source)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-api${{ matrix.api-level }}-reports
          path: reports/
          retention-days: 14
